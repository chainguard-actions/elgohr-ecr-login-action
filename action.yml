name: 'AWS ECR Docker Login'
author: 'Lars Gohr'
branding:
  icon: 'log-in'
  color: 'orange'
description: 'Logs into ECR and provides Docker credentials'
inputs:
  access_key:
    description: 'The AWS access key'
    required: true
  secret_access_key:
    description: 'The AWS secret access key'
    required: true
  region:
    description: 'The AWS region you would like to login to'
    required: true
outputs:
  username:
    description: 'The username for logging in'
    value: ${{ steps.ecr-login.outputs.username }}
  password:
    description: 'The password for logging in'
    value: ${{ steps.ecr-login.outputs.password }}
  registry:
    description: 'The registry to log in to'
    value: ${{ steps.ecr-login.outputs.registry }}
  docker_name:
    description: 'The name of the docker image'
    value: ${{ steps.ecr-login.outputs.docker_name }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: ecr-login
      run: $GITHUB_ACTION_PATH/entrypoint.sh
      shell: bash
      env:
        INPUT_ACCESS_KEY: ${{ inputs.access_key }}
        INPUT_SECRET_ACCESS_KEY: ${{ inputs.secret_access_key }}
        INPUT_REGION: ${{ inputs.region }}
