name: Test ECR login sets AWS environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock AWS CLI that validates env vars
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/aws << 'EOF'
          #!/bin/sh
          # Validate that the expected AWS env vars are set
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "FAIL: AWS_ACCESS_KEY_ID is not set" >&2
            exit 1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "FAIL: AWS_SECRET_ACCESS_KEY is not set" >&2
            exit 1
          fi
          if [ -z "$AWS_DEFAULT_REGION" ]; then
            echo "FAIL: AWS_DEFAULT_REGION is not set" >&2
            exit 1
          fi
          if [ "$AWS_ACCESS_KEY_ID" != "TESTKEY123" ]; then
            echo "FAIL: AWS_ACCESS_KEY_ID mismatch: $AWS_ACCESS_KEY_ID" >&2
            exit 1
          fi
          if [ "$AWS_DEFAULT_REGION" != "ap-southeast-1" ]; then
            echo "FAIL: AWS_DEFAULT_REGION mismatch: $AWS_DEFAULT_REGION" >&2
            exit 1
          fi
          # Return valid ECR token: base64 of "AWS:TESTPASSWORD"
          echo '{"authorizationData":[{"authorizationToken":"QVdTOlRFU1RURVNUUEFTU1dPUkQ=","expiresAt":1569961966.371,"proxyEndpoint":"https://111111111111.dkr.ecr.ap-southeast-1.amazonaws.com"}]}'
          exit 0
          EOF
          chmod +x /tmp/mock-bin/aws
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: ecr-login
        uses: .
        with:
          access_key: TESTKEY123
          secret_access_key: TESTSECRETKEY456
          region: ap-southeast-1

      - name: Assert username output is set
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.username }}
        run: |
          echo "actual username: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty username"
            exit 1
          fi
          echo "PASS: username is set to '$ACTUAL'"

      - name: Assert registry output is set
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "actual registry: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty registry"
            exit 1
          fi
          echo "PASS: registry is set to '$ACTUAL'"

      - name: Assert docker_name does not contain https
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.docker_name }}
        run: |
          echo "actual docker_name: $ACTUAL"
          if echo "$ACTUAL" | grep -q "https://"; then
            echo "FAIL: docker_name should not contain 'https://', got '$ACTUAL'"
            exit 1
          fi
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty docker_name"
            exit 1
          fi
          echo "PASS: docker_name '$ACTUAL' does not contain https://"
