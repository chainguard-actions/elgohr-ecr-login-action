name: Test ECR login action invocation with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Invoke ECR login action with fake credentials
        id: ecr_login
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: us-east-1
      - name: Assert action ran (pass or fail with auth error)
        env:
          OUTCOME: ${{ steps.ecr_login.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should either succeed (unlikely with fake creds) or fail
          # with an AWS authentication error — not with a structural/config error.
          # Either 'success' or 'failure' is acceptable; 'skipped' is not.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
