name: Test ECR login required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: ap-southeast-1
      - name: Assert action ran with all required inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action must have run — outcome must be 'success' or 'failure'
          # (not 'skipped' or empty), confirming all required inputs were accepted.
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action was skipped or did not run — required inputs may not have been accepted"
            exit 1
          fi
          echo "PASS: action ran with all required inputs provided (outcome=$OUTCOME)"
