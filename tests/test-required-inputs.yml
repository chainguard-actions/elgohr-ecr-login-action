name: Test ECR login action with all required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: eu-west-1
      - name: Assert action ran with all required inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should not be skipped — all required inputs were provided.
          # With fake credentials it will fail at the AWS API call, which is expected.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all required inputs (outcome: ${{ steps.action.outcome }})"
      - name: Assert registry output format when action succeeds
        if: steps.action.outcome == 'success'
        env:
          REGISTRY: ${{ steps.action.outputs.registry }}
        run: |
          echo "registry: $REGISTRY"
          # Registry should contain the region in its URL
          if echo "$REGISTRY" | grep -q "eu-west-1"; then
            echo "PASS: registry output contains expected region"
          else
            echo "FAIL: registry output does not contain expected region 'eu-west-1'"
            echo "registry value: $REGISTRY"
            exit 1
          fi
