name: Test ECR action region and registry format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Invoke ECR login action with eu-west-1 region
        id: ecr_login
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: eu-west-1
      - name: Assert action ran (pass or fail with auth error)
        env:
          OUTCOME: ${{ steps.ecr_login.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should either succeed or fail with an AWS auth error,
          # but not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
      - name: Verify ECR registry format pattern
        run: |
          # ECR registry format: <account-id>.dkr.ecr.<region>.amazonaws.com
          REGION="eu-west-1"
          ACCOUNT_ID="123456789012"
          EXPECTED_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          echo "Expected ECR registry format: $EXPECTED_REGISTRY"
          if [[ ! "$EXPECTED_REGISTRY" =~ ^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com$ ]]; then
            echo "FAIL: ECR registry format does not match expected pattern"
            exit 1
          fi
          echo "PASS: ECR registry format is valid"
      - name: Verify action docker image is specified
        run: |
          if ! grep -q "docker://lgohr/ecr-login-action" "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: docker image not found in action.yml"
            exit 1
          fi
          echo "PASS: docker image is specified in action.yml"
