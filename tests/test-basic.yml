name: Test basic ECR login inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: us-east-1
      - name: Assert action was invoked with all required inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action requires real AWS credentials to succeed.
          # We verify it ran (not skipped) and that all required inputs were passed.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with all required inputs (access_key, secret_access_key, region)"
