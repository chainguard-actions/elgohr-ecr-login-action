name: Test basic ECR login outputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: us-east-1
      - name: Assert action ran (outputs or error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REGISTRY: ${{ steps.action.outputs.registry }}
          USERNAME: ${{ steps.action.outputs.username }}
        run: |
          echo "outcome: $OUTCOME"
          echo "registry: $REGISTRY"
          echo "username: $USERNAME"
          # The action either succeeds (real creds) or fails (fake creds).
          # Either way, the action must have run — outcome must not be empty.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run (outcome is empty)"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
