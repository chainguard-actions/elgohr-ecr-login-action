name: Test basic ECR login inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: ecr-login
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: us-east-1
      - name: Assert action was invoked with all required inputs
        run: |
          echo "ECR login step outcome: ${{ steps.ecr-login.outcome }}"
          # The action should have run (either succeeded or failed due to invalid creds)
          # but it must not have been skipped — that would indicate a setup problem
          if [ "${{ steps.ecr-login.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with all required inputs (access_key, secret_access_key, region)"
