name: Test basic ECR login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock aws CLI
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/aws << 'EOF'
          #!/bin/sh
          # Mock aws ecr get-authorization-token
          # Token QVdTOkFVVEhfUEFTU1dPUkQ= decodes to AWS:AUTH_PASSWORD
          echo '{"authorizationData":[{"authorizationToken":"QVdTOkFVVEhfUEFTU1dPUkQ=","expiresAt":1569961966.371,"proxyEndpoint":"https://123456789.dkr.ecr.us-east-1.amazonaws.com"}]}'
          exit 0
          EOF
          chmod +x /tmp/mock-bin/aws
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          access_key: fake-access-key
          secret_access_key: fake-secret-key
          region: us-east-1

      - name: Assert username output
        env:
          ACTUAL: ${{ steps.action.outputs.username }}
        run: |
          echo "actual username: $ACTUAL"
          if [ "$ACTUAL" != "AWS" ]; then
            echo "FAIL: expected username 'AWS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: username is AWS"

      - name: Assert registry output
        env:
          ACTUAL: ${{ steps.action.outputs.registry }}
        run: |
          echo "actual registry: $ACTUAL"
          if [ "$ACTUAL" != "https://123456789.dkr.ecr.us-east-1.amazonaws.com" ]; then
            echo "FAIL: expected registry 'https://123456789.dkr.ecr.us-east-1.amazonaws.com', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: registry is correct"

      - name: Assert docker_name output
        env:
          ACTUAL: ${{ steps.action.outputs.docker_name }}
        run: |
          echo "actual docker_name: $ACTUAL"
          if [ "$ACTUAL" != "123456789.dkr.ecr.us-east-1.amazonaws.com" ]; then
            echo "FAIL: expected docker_name '123456789.dkr.ecr.us-east-1.amazonaws.com', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: docker_name is correct"

      - name: Assert password output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.password }}
        run: |
          echo "actual password length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty password"
            exit 1
          fi
          echo "PASS: password is non-empty"
