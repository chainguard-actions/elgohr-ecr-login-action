name: Test basic ECR login inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: ecr-login
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: us-east-1
      - name: Assert action was invoked with all required inputs
        run: |
          echo "ECR login step outcome: ${{ steps.ecr-login.outcome }}"
          # The action runs a Docker container that calls real AWS ECR.
          # With fake credentials it will fail to authenticate, which is expected.
          # We verify the step ran (outcome is either 'success' or 'failure', not 'skipped').
          OUTCOME="${{ steps.ecr-login.outcome }}"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — it should have been invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
