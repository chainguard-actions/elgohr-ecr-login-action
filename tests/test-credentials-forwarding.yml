name: Test AWS credentials are forwarded correctly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install credential-checking mock AWS CLI
        run: |
          # This mock verifies that the correct AWS env vars are set when called
          mkdir -p "$HOME/mock-bin"
          cat > "$HOME/mock-bin/aws" << 'EOF'
          #!/usr/bin/env bash
          # Verify the expected credentials are forwarded as env vars
          EXPECTED_KEY="AKIAIOSFODNN7EXAMPLE"
          EXPECTED_SECRET="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          EXPECTED_REGION="eu-west-1"

          if [ "$AWS_ACCESS_KEY_ID" != "$EXPECTED_KEY" ]; then
            echo "ERROR: AWS_ACCESS_KEY_ID mismatch: got '$AWS_ACCESS_KEY_ID'" >&2
            exit 1
          fi
          if [ "$AWS_SECRET_ACCESS_KEY" != "$EXPECTED_SECRET" ]; then
            echo "ERROR: AWS_SECRET_ACCESS_KEY mismatch" >&2
            exit 1
          fi
          if [ "$AWS_DEFAULT_REGION" != "$EXPECTED_REGION" ]; then
            echo "ERROR: AWS_DEFAULT_REGION mismatch: got '$AWS_DEFAULT_REGION'" >&2
            exit 1
          fi

          # Return a valid ECR token response
          echo '{"authorizationData":[{"authorizationToken":"QVdTOkFVVEhfUEFTU1dPUkQK","expiresAt":1569961966.371,"proxyEndpoint":"https://999999999999.dkr.ecr.eu-west-1.amazonaws.com"}]}'
          EOF
          chmod +x "$HOME/mock-bin/aws"
          echo "$HOME/mock-bin" >> "$GITHUB_PATH"

      - id: ecr-login
        uses: .
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: eu-west-1

      - name: Assert registry reflects correct region
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "actual registry: $ACTUAL"
          if [ "$ACTUAL" != "https://999999999999.dkr.ecr.eu-west-1.amazonaws.com" ]; then
            echo "FAIL: expected registry for eu-west-1, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert docker_name strips https prefix
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.docker_name }}
        run: |
          echo "actual docker_name: $ACTUAL"
          if [ "$ACTUAL" != "999999999999.dkr.ecr.eu-west-1.amazonaws.com" ]; then
            echo "FAIL: expected docker_name without https://, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
