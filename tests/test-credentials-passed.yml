name: Test AWS credentials are passed correctly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock aws CLI that validates credentials
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/aws << 'EOF'
          #!/bin/sh
          # Validate that the expected AWS env vars are set
          if [ "$AWS_ACCESS_KEY_ID" != "my-test-access-key" ]; then
            echo "FAIL: AWS_ACCESS_KEY_ID mismatch: got '$AWS_ACCESS_KEY_ID'" >&2
            exit 1
          fi
          if [ "$AWS_SECRET_ACCESS_KEY" != "my-test-secret-key" ]; then
            echo "FAIL: AWS_SECRET_ACCESS_KEY mismatch: got '$AWS_SECRET_ACCESS_KEY'" >&2
            exit 1
          fi
          if [ "$AWS_DEFAULT_REGION" != "ap-southeast-1" ]; then
            echo "FAIL: AWS_DEFAULT_REGION mismatch: got '$AWS_DEFAULT_REGION'" >&2
            exit 1
          fi
          # Return valid token: QVdTOlZBTElEX1BBU1M= decodes to AWS:VALID_PASS
          echo '{"authorizationData":[{"authorizationToken":"QVdTOlZBTElEX1BBU1M=","expiresAt":1569961966.371,"proxyEndpoint":"https://111222333.dkr.ecr.ap-southeast-1.amazonaws.com"}]}'
          exit 0
          EOF
          chmod +x /tmp/mock-bin/aws
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          access_key: my-test-access-key
          secret_access_key: my-test-secret-key
          region: ap-southeast-1

      - name: Assert username output
        env:
          ACTUAL: ${{ steps.action.outputs.username }}
        run: |
          echo "actual username: $ACTUAL"
          if [ "$ACTUAL" != "AWS" ]; then
            echo "FAIL: expected username 'AWS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: username is AWS"

      - name: Assert registry output
        env:
          ACTUAL: ${{ steps.action.outputs.registry }}
        run: |
          echo "actual registry: $ACTUAL"
          if [ "$ACTUAL" != "https://111222333.dkr.ecr.ap-southeast-1.amazonaws.com" ]; then
            echo "FAIL: expected registry 'https://111222333.dkr.ecr.ap-southeast-1.amazonaws.com', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: registry is correct"

      - name: Assert docker_name output
        env:
          ACTUAL: ${{ steps.action.outputs.docker_name }}
        run: |
          echo "actual docker_name: $ACTUAL"
          if [ "$ACTUAL" != "111222333.dkr.ecr.ap-southeast-1.amazonaws.com" ]; then
            echo "FAIL: expected docker_name '111222333.dkr.ecr.ap-southeast-1.amazonaws.com', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: docker_name is correct"
