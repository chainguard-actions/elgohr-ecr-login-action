name: Test ECR login fallback username
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock AWS CLI with empty username token
        run: |
          # Token is base64 of ":FALLBACK_PASS" (empty username before colon)
          # echo -n ":FALLBACK_PASS" | base64 => OkZBTExCQUNLX1BBU1M=
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/aws << 'EOF'
          #!/bin/sh
          echo '{"authorizationData":[{"authorizationToken":"OkZBTExCQUNLX1BBU1M=","expiresAt":1569961966.371,"proxyEndpoint":"https://999999999999.dkr.ecr.eu-west-1.amazonaws.com"}]}'
          exit 0
          EOF
          chmod +x /tmp/mock-bin/aws
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: ecr-login
        uses: .
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: eu-west-1

      - name: Assert username falls back to AWS
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.username }}
        run: |
          echo "actual username: $ACTUAL"
          if [ "$ACTUAL" != "AWS" ]; then
            echo "FAIL: expected fallback username 'AWS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: username correctly falls back to 'AWS'"

      - name: Assert registry uses eu-west-1 region
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "actual registry: $ACTUAL"
          if [ "$ACTUAL" != "https://999999999999.dkr.ecr.eu-west-1.amazonaws.com" ]; then
            echo "FAIL: expected eu-west-1 registry, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: registry matches eu-west-1"

      - name: Assert docker_name strips https prefix
        env:
          ACTUAL: ${{ steps.ecr-login.outputs.docker_name }}
        run: |
          echo "actual docker_name: $ACTUAL"
          if [ "$ACTUAL" != "999999999999.dkr.ecr.eu-west-1.amazonaws.com" ]; then
            echo "FAIL: expected docker_name without https://, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: docker_name correctly strips https:// prefix"
