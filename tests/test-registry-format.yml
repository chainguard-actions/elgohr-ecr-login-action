name: Test ECR registry output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          access_key: AKIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          region: eu-west-1
      - name: Assert registry contains region when action succeeds
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REGISTRY: ${{ steps.action.outputs.registry }}
        run: |
          echo "outcome: $OUTCOME"
          echo "registry: $REGISTRY"
          # If the action succeeded (real creds injected), verify registry format
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REGISTRY" ]; then
              echo "FAIL: action succeeded but registry output is empty"
              exit 1
            fi
            # ECR registry format: <account-id>.dkr.ecr.<region>.amazonaws.com
            if echo "$REGISTRY" | grep -qE '\.dkr\.ecr\.eu-west-1\.amazonaws\.com$'; then
              echo "PASS: registry output matches expected ECR format for eu-west-1"
            else
              echo "FAIL: registry '$REGISTRY' does not match ECR format for eu-west-1"
              exit 1
            fi
          else
            echo "INFO: action failed (expected with fake credentials) — skipping registry format check"
            echo "PASS: action ran and handled invalid credentials"
          fi
